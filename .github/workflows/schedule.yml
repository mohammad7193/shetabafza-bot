# کدهای قبلی شما اینجاست...
    - name: Run bot script
      run: python bot.py

    # این بخش جدید را به انتهای فایل اضافه کنید:
    - name: Save History File to Repository
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add history.txt
        git commit -m "Update post history to avoid duplicates" || echo "No changes to commit"
        git push
