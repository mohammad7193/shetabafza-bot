name: Telegram Auto Post

on:
  schedule:
    # این زمان بر اساس UTC است. 07:00 یعنی حدود ساعت 10:30 صبح به وقت ایران
    - cron: '0 7 * * *'
  workflow_dispatch: # این خط به ما اجازه می‌دهد دستی هم کد را تست کنیم

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Telegram Bot
        run: python bot.py
